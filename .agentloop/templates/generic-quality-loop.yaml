name: generic-quality-loop
description: General quality loop template for AI-assisted project work.
adapter: codex
prompt: |
  You are working in the current workspace.

  Task:
  {{ task_description }}

  Constraints:
  - Keep changes scoped to the requested task.
  - Preserve existing user work.
  - Stop and report BLOCKED: if objective checks cannot pass without missing information.
  - Treat these acceptance criteria as the objective checks to satisfy:
  {{ acceptance_criteria }}
max_iterations: 3
variables:
  - name: task_description
    required: true
  - name: acceptance_criteria
    required: false
    default: Complete the requested task and verify it works.
  - name: check_command
    required: false
    default: "true"
  - name: secret_token
    required: false
    secret: true
checks:
  - name: objective check
    command: "{{ check_command }}"
