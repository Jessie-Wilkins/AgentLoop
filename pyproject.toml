[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentloop"
version = "0.1.0"
description = "Local-first loop engineering for repeat-until-pass AI workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Jinja2>=3.1",
  "PyYAML>=6.0"
]

[project.scripts]
agentloop = "agentloop.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentloop*"]
